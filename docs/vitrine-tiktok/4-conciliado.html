<!doctype html><meta charset="utf-8"><title>NEXO — conciliado</title>
<link rel="stylesheet" href="vitrine.css">
<!-- PEÇA 4 — CONCILIADO COM O EXTRATO OFICIAL. O benefício aprovado diz "ao
     centavo, pedido a pedido"; a peça mostra os dois lados e a igualdade, que é
     a única forma de afirmar isso sem pedir fé.
     ⚠️ Números sintéticos. -->
<style>
  .par{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:0;margin-top:44px}
  .lado{border:1px solid var(--ink-12);border-radius:20px;padding:30px 28px}
  .lado h3{font-size:18px;font-weight:700;color:var(--ink-50);letter-spacing:.06em;text-transform:uppercase}
  .lado .v{font-size:46px;font-weight:800;margin-top:16px;letter-spacing:-.03em}
  .lado .d{color:var(--ink-64);font-size:17px;margin-top:10px}
  .igual{display:grid;place-items:center;font-size:46px;font-weight:800;color:var(--ink-50)}
  .selo{display:inline-flex;align-items:center;gap:12px;margin-top:38px;border:1px solid var(--ink-12);border-radius:999px;padding:14px 24px;font-size:20px;font-weight:700}
  .selo b{width:26px;height:26px;border-radius:999px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:16px}
</style>
<div class="palco">
  <div class="marca"><i></i>NEXO</div>
  <p class="kicker" style="margin-top:30px">Conciliação</p>
  <h2 style="margin-top:10px">O número da tela bate<br>com o repasse oficial.</h2>
  <div class="par">
    <div class="lado"><h3>No NEXO</h3><div class="v num">R$ 7.148,63</div><div class="d">142 pedidos · agosto</div></div>
    <div class="igual">=</div>
    <div class="lado"><h3>Extrato do canal</h3><div class="v num">R$ 7.148,63</div><div class="d">Repasse conferido pedido a pedido</div></div>
  </div>
  <span class="selo"><b>✓</b>Ao centavo</span>
  <p class="rodape">Valores ilustrativos.</p>
</div>
