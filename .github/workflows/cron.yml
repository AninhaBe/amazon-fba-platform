name: Sync agendado (SellerCore)

# Dispara os endpoints de sincronização que já existem no app. Necessário porque
# o deploy é no Render, que ignora os crons do vercel.json — sem isto, o backfill
# canônico (Amazon/ML) só avança quando alguém abre o dashboard.
#
# Requisitos (uma vez):
#   - No Render: definir a env var CRON_SECRET (valor aleatório) e redeploy.
#   - No GitHub (Settings → Secrets and variables → Actions → New repository secret):
#       APP_BASE_URL = https://<seu-app>.onrender.com   (sem barra no fim)
#       CRON_SECRET  = o MESMO valor definido no Render
#
# Observação: o agendamento do GitHub Actions é best-effort e pode atrasar alguns
# minutos sob carga; para backfill de histórico isso é irrelevante. O mínimo de
# intervalo do GitHub é 5 minutos.
#
# ⚠️ 19/08/2026 — intervalo passou de 5 para 15 minutos por COTA, não por técnica.
# A conta bateu 1.801 dos 2.000 minutos/mês de Actions com 13 dias de ciclo pela
# frente (~95 min/dia). A 5 minutos, os 199 restantes acabariam em ~2 dias, e aí
# o sync pararia ou passaria a ser cobrado.
#
# Piorou justamente quando o cron voltou a funcionar: execução que falhava rápido
# levava 37-45s; bem-sucedida leva 1m11s-1m44s.
#
# 📌 Isto é PALIATIVO. A correção é o agendador rodar dentro do app no Fly, que
# fica de pé 24/7 de qualquer forma — sem cota de terceiro, sem volta pela
# internet pública e sem segredo de cron. Ver ADR-017 (a escrever).
# A máquina agendada nativa do Fly NÃO serve: `--schedule` só aceita hourly,
# daily, weekly e monthly — não aceita expressão cron.

# Sobre o `--retry`: um deploy no Render reinicia o container, e qualquer cron
# que dispare nessa janela recebe 502 — falha real para o curl, mas nada quebrado.
# Repetir resolve o transitorio SEM esconder problema: se persistir depois das
# tentativas, o job falha e o e-mail chega, que e quando importa.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions (para testar)

concurrency:
  group: sellercore-sync
  cancel-in-progress: false

jobs:
  sync-mercado-livre:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verifica os segredos
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Defina os secrets APP_BASE_URL e CRON_SECRET no repositório."
            exit 1
          fi

      - name: Sync Mercado Livre
        run: |
          curl -sS --fail-with-body \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/mercado-livre-sync"

  sync-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verifica os segredos
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Defina os secrets APP_BASE_URL e CRON_SECRET no repositório."
            exit 1
          fi

      - name: Sync Amazon
        run: |
          curl -sS --fail-with-body \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/amazon-sync"

  sync-shopee:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verifica os segredos
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Defina os secrets APP_BASE_URL e CRON_SECRET no repositório."
            exit 1
          fi

      # Shopee só tem trabalho quando existe loja conectada; sem conexão o
      # endpoint responde de imediato com processed: 0.
      - name: Sync Shopee
        run: |
          curl -sS --fail-with-body \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/shopee-sync"

  # Job independente: indisponibilidade ou timeout dos outros marketplaces não
  # pode impedir a ingestão TikTok. Não declarar `needs` é intencional.
  sync-tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verifica os segredos
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Defina os secrets APP_BASE_URL e CRON_SECRET no repositório."
            exit 1
          fi

      # Responde processed: 0 quando não há loja elegível.
      - name: Sync TikTok Shop
        run: |
          curl -sS --fail-with-body \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/tiktok-sync"
