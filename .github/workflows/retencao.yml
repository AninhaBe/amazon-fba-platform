name: Retenção de dados efêmeros (NEXO)

# Expurga a caixa de entrada de webhooks já processada — ver docs/adr/ADR-016.
#
# Separado do cron de sync de propósito: sync roda a cada 5 minutos, retenção
# precisa rodar uma vez por dia. Misturar os dois faria o expurgo disparar 288
# vezes ao dia sem necessidade.
#
# Requisitos (os mesmos do cron de sync, já configurados):
#   APP_BASE_URL e CRON_SECRET nos secrets do repositório.

# 🔴 AGENDAMENTO DESLIGADO EM 21/08/2026 — ver ADR-019. A retenção diária passou
# para o agendador interno (src/instrumentation.ts). Fica o gatilho manual.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela de retenção em dias (mínimo 7; valores menores são ignorados)"
        required: false
        default: "7"

concurrency:
  group: nexo-retencao
  cancel-in-progress: false

jobs:
  retencao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DIAS: ${{ github.event.inputs.dias || '7' }}
    steps:
      - name: Verifica os segredos
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Defina os secrets APP_BASE_URL e CRON_SECRET no repositório."
            exit 1
          fi

      # A resposta é impressa no log do job de propósito (ADR-016, regra 4:
      # nada de expurgo silencioso). Ela traz quantas linhas saíram, quantas
      # restaram e quantas ainda estão elegíveis — se sobrar elegível, o lote
      # encheu e a execução do dia seguinte continua de onde parou.
      - name: Aplica retenção
        run: |
          curl -sS --fail-with-body \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/cron/retencao?dias=${DIAS}"
          echo
