# NEXO no Fly.io — ver docs/adr/ADR-015
#
# Deploy:  wsl bash scripts/fly-deploy.sh
# (o script le as NEXT_PUBLIC_* do .env.local e passa como --build-arg;
#  NAO rodar `fly deploy` cru, a imagem sai sem as credenciais do Supabase)

app = "nexo"
primary_region = "gru"          # Sao Paulo — a razao de existir desta migracao

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"            # precisa casar com o mount abaixo

[http_service]
  internal_port = 3000
  force_https = true

  # ⚠️ NAO LIGAR auto_stop_machines.
  # O cache do NEXO vive na memoria do processo (ADR-002) e a conciliacao de
  # tarifas roda em background dentro do web. Maquina que hiberna perde o cache
  # e mata trabalho em andamento — seria reintroduzir por configuracao o mesmo
  # problema que fez a Vercel ser rejeitada.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"        # o app sobe rapido, mas o primeiro render nao
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# Métricas em formato Prometheus, coletadas pelo Fly a cada 15s e visíveis no
# Grafana gerenciado (fly-metrics.net, sem custo adicional).
#
# Por que existe (ADR-019): ao desligar o cron do GitHub sumiu o único aviso de
# "o sync parou" — o e-mail de falha do Actions. Estas séries devolvem o sinal, e
# com histórico em vez de um e-mail solto.
#
# ⚠️ Porta 9091, NÃO a 3000 do app: ela fica fora do [http_service], então não é
# publicada na internet — o coletor do Fly chega pela rede privada. Servir isto
# pela porta pública exigiria abrir a rota no proxy de sessão, e colocaria
# contagem de pedidos e tamanho de banco em endereço aberto.
# O servidor vive em src/instrumentation.ts, junto do agendador.
[metrics]
  port = 9091
  path = "/metrics"

# Disco persistente: o app grava custos e contas OAuth em DATA_DIR.
# Sem isto, cada deploy apaga esses dados.
# Criar antes do primeiro deploy:  fly volumes create nexo_data --region gru --size 1
[mounts]
  source = "nexo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                # 512 MB esta descartado: foi o que matou o Render Free
